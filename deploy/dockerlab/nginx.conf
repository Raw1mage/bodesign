worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Dedicated HTTP ingress for bodesign MCP (LAN private network)
    server {
        listen 8177;
        server_name 192.168.100.141;

        client_max_body_size 100M;
        client_body_buffer_size 16M;

        # Hard-block legacy unauthenticated invoke endpoint from LAN (BR_20260730d)
        location /invoke {
            return 403 "invoke endpoint is disabled on LAN\n";
        }

        location / {
            proxy_pass http://bodesign:8077;
            proxy_http_version 1.1;

            # Critical for MCP Streamable-HTTP / SSE chunking:
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Standard headers forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Connection "";
        }

        # Healthcheck endpoint
        location /healthz {
            proxy_pass http://bodesign:8077/healthz;
            proxy_http_version 1.1;
        }
    }
}
