# bodesign MCP Server — DockerLab (CT105: 192.168.100.141)
# Deployed under /opt/bodesign/
# Port 8177 allocated via central port_registry for LAN-plain HTTP MCP ingress (no TLS/auth; /invoke 403 at nginx).

services:
  bodesign:
    image: registore.thesmart.cc/bodesign:d41d426
    container_name: bodesign-app
    restart: unless-stopped
    command: ["--transport", "http", "--host", "0.0.0.0", "--port", "8077"]
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      HOST_UID: "1000"
      HOST_GID: "1000"
      BODESIGN_SESSIONS_ROOT: "/var/cache/bodesign/sessions"
      BODESIGN_KB_DB: "/var/lib/bodesign/kb/ragbase.sqlite"
      BODESIGN_VAULT_DIR: "/run/bodesign/vault"
      BODESIGN_AUTH_PROVIDER: "builtin"
      FLEET_DRAFTS_DB: "/var/lib/fleet/drafts/feedback_drafts.db"
      FLEET_SIDECAR_SOCKET: "/run/fleet/sidecar.sock"
    volumes:
      # Ephemeral token store on local NVMe (managed by token_store TTL/GC)
      - bodesign-sessions:/var/cache/bodesign/sessions
      # Read-only Component KB snapshot
      - /opt/bodesign/kb/ragbase.sqlite:/var/lib/bodesign/kb/ragbase.sqlite:ro
      # Writable server-owned component cache, seeded once from a dev snapshot
      - /opt/bodesign/vault:/run/bodesign/vault
      - fleet-runtime:/run/fleet
      - fleet-drafts:/var/lib/fleet/drafts
    networks:
      - bodesign-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8077/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  fleet-sidecar:
    image: registore.thesmart.cc/bodesign:d41d426
    container_name: bodesign-fleet-sidecar
    restart: unless-stopped
    env_file:
      - /opt/bodesign/fleet.env
    entrypoint: ["sh", "-ec"]
    command:
      - |
        mkdir -p /run/fleet /var/lib/fleet/drafts /var/lib/fleet/outbox
        chown 1000:1000 /run/fleet /var/lib/fleet/drafts /var/lib/fleet/outbox
        chmod 0700 /run/fleet /var/lib/fleet/drafts /var/lib/fleet/outbox
        setpriv --reuid 1000 --regid 1000 --init-groups python3 -c 'from feedback_drafts import connect; connect().close()'
        exec setpriv --reuid 1000 --regid 1000 --init-groups python3 /opt/fleet/fleet-outbox-adapter.py
    volumes:
      # Deployment-owned code remains dynamic and read-only (R705).
      - /opt/bodesign/fleet-outbox-adapter.py:/opt/fleet/fleet-outbox-adapter.py:ro
      - /opt/bodesign/fleet-outbox-reconcile.py:/opt/fleet/fleet-outbox-reconcile.py:ro
      - fleet-runtime:/run/fleet
      - fleet-drafts:/var/lib/fleet/drafts
      - fleet-outbox:/var/lib/fleet/outbox
    networks:
      - bodesign-net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  nginx-sidecar:
    image: nginx:alpine
    container_name: bodesign-ingress
    restart: unless-stopped
    ports:
      - "8177:8177"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bodesign-net
    depends_on:
      bodesign:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

networks:
  bodesign-net:
    driver: bridge

volumes:
  bodesign-sessions:
    driver: local
  fleet-runtime:
    driver: local
  fleet-drafts:
    driver: local
  fleet-outbox:
    driver: local
