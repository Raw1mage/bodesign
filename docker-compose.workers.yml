# bodesign worker overlay (Batch E Phase 1) — opt-in responsibility-grouped split.
#
#   docker compose -f docker-compose.yml -f docker-compose.workers.yml up -d --build
#
# Without this overlay, `docker-compose.yml` alone is the monolith (everything
# in-process, --tools defaults to "all") — unchanged, non-breaking. With it, the
# core serves core+ee locally and FORWARDS bodesign_c02_* to the lean bodesign-me
# worker. Both mount the same bodesign-sessions volume (the shared project tree).
services:
  bodesign:
    # Lean core front: build from Dockerfile.core (no KiCad/LibreOffice/OpenSCAD/OCP).
    # Serve only the core group locally; forward me + ee + docs to their workers.
    build:
      dockerfile: Dockerfile.core
    command: ["--transport", "http", "--uds", "/run/bodesign/bodesign.sock",
              "--host", "0.0.0.0", "--port", "8077", "--tools", "core"]
    environment:
      BODESIGN_ME_WORKER_URL: "http://bodesign-me:8077"
      BODESIGN_EE_WORKER_URL: "http://bodesign-ee:8077"
    depends_on:
      - bodesign-me
      - bodesign-ee
    # Final docx/pdf/pptx rendering is delegated to docxmcp (run alongside; it already
    # ships LibreOffice). No bodesign-docs worker — bodesign emits the markdown source.

  bodesign-ee:
    image: bodesign-ee:latest
    build:
      context: .
      dockerfile: Dockerfile.ee
    # --host 0.0.0.0 so the core reaches it over the compose network (default
    # 127.0.0.1 binds container-loopback only → core forwarding would fail).
    command: ["--transport", "http", "--host", "0.0.0.0", "--port", "8077", "--tools", "ee"]
    volumes:
      - "bodesign-sessions:/var/cache/bodesign/sessions"
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      BODESIGN_SESSIONS_ROOT: "/var/cache/bodesign/sessions"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8077/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  bodesign-me:
    image: bodesign-me:latest
    build:
      context: .
      dockerfile: Dockerfile.me
    # --host 0.0.0.0 so the core reaches it over the compose network (default
    # 127.0.0.1 binds container-loopback only → core forwarding would fail).
    command: ["--transport", "http", "--host", "0.0.0.0", "--port", "8077", "--tools", "me"]
    volumes:
      # Same session tree as the core so constraints/Enclosure.step are shared.
      - "bodesign-sessions:/var/cache/bodesign/sessions"
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      BODESIGN_SESSIONS_ROOT: "/var/cache/bodesign/sessions"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8077/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
