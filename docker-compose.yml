# bodesign MCP server — per-user container (G10d). Mirrors docxmcp.
#
#   mcpctl.sh start        # docker compose -p bodesign-${USER} up -d --build
#
# Transport: MCP Streamable HTTP over a Unix domain socket. uvicorn binds the
# socket inside the container at /run/bodesign/bodesign.sock; the host reaches
# it via the ./.run bind mount (the IPC rendezvous). External HTTP, if wanted,
# is exposed by a gateway in front of this socket (not a published port here).
services:
  bodesign:
    image: bodesign:latest
    build:
      context: .
    # Serve both: UDS (local IPC) + TCP HTTP (external) from one process.
    command: ["--transport", "http", "--uds", "/run/bodesign/bodesign.sock", "--host", "0.0.0.0", "--port", "8077"]
    ports:
      - "8077:8077"
    volumes:
      # IPC rendezvous: the UDS lives here, host-visible.
      - "./.run:/run/bodesign"
      # Token file store + analysis cache (host-invisible named volume).
      - "bodesign-sessions:/var/cache/bodesign/sessions"
      # Component Vault (R10): repo-local, host-visible, long-term store under
      # ./.run/vault (vault.db + blobs/). It is the SAME ./.run bind mount above,
      # so the vault lives at /run/bodesign/vault inside the container and
      # accumulates day-to-day ingested datasheets on the host — persistent,
      # readable AND writable, survives restarts. Corrupt DB fails fast
      # (VAULT-E001) — never recreated; restore from a host-side backup of
      # ./.run/vault instead. (Was a docker named volume; re-pointed to the
      # repo-local bind so the populated vault is the one the server serves —
      # BR_20260705_vault_split.)
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      BODESIGN_SESSIONS_ROOT: "/var/cache/bodesign/sessions"
      BODESIGN_VAULT_DIR: "/run/bodesign/vault"
      # Gateway prefix for in-page links (gateway strips it for the UDS route).
      BODESIGN_HTTP_BASE: "/bodesign"
      # R14.5 (BR_20260706): explicit per-host WebDAV provision — "capability
      # compiled in" ≠ "mount provisioned on this host". bodesign ships only
      # the builtin Basic-auth provider (DD-6); declaring it here makes the
      # provision state explicit (host_provision.explicit=true) instead of
      # implied by the image.
      BODESIGN_AUTH_PROVIDER: "builtin"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "/run/bodesign/bodesign.sock"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s

volumes:
  bodesign-sessions:
    driver: local
  # NOTE: the Component Vault (R10) is no longer a docker named volume — it is a
  # repo-local bind mount at ./.run/vault (see BODESIGN_VAULT_DIR above). The
  # vault tools live in the `core` group, so only the core front serves it.
